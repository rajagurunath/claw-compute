services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: claw
      POSTGRES_PASSWORD: claw
      POSTGRES_DB: claw_dev
    ports:
      - "5432:5432"
    volumes:
      - claw-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw -d claw_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  claw-pg:
