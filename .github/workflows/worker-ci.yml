name: worker-ci
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-ci.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-ci.yml"]

jobs:
  test:
    # macOS runner so we can build for aarch64-apple-darwin and exercise
    # macOS-only deps (keyring crate). Linux fmt/clippy is a nice-to-have
    # but skipping it for v1 keeps the workflow simple.
    runs-on: macos-14
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/target
          key: worker-${{ runner.os }}-${{ hashFiles('worker/Cargo.lock') }}
          restore-keys: worker-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --target aarch64-apple-darwin
