name: backend-ci
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claw
          POSTGRES_PASSWORD: claw
          POSTGRES_DB: claw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claw"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://claw:claw@localhost:5432/claw_test
      JWT_SECRET: test-secret-32-bytes-of-randomness-x
      MAGIC_LINK_DELIVERY: console
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest -v
